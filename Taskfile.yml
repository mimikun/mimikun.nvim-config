---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  TODAY:
    sh: date +'%Y%m%d'

env:
  MAIN_BRANCH: master
  CODEBERG_URL: https://codeberg.org/mimikun/nvim-new

tasks:
  default:
    cmds:
      - task --list
    silent: true

  clean:
    desc: File cleanup
    cmds:
      - echo "WIP"
    silent: true

  pull:
    desc: git pull
    cmds:
      - git pull
    silent: true

  push:
    desc: git push
    cmds:
      - git push origin master
      - git push codeberg master
    silent: true

  clean-fetch:
    desc: git cleanfetch
    aliases:
      - cleanfetch
    cmds:
      - git fetch --all --prune --tags --prune-tags
    silent: true

  delete-branch:
    desc: Delete patch branch
    aliases:
      - deleb
    cmds:
      - task: clean
      - task: switch-master
      - git branch --list "patch*" | xargs -n 1 git branch -D
    silent: true

  morning-routine:
    desc: Morning routine by Work-day
    cmds:
      - task: clean-fetch
      - task: delete-branch
      - task: pull
      - task: patch-branch
    silent: true

  switch-master:
    desc: Switch to master branch
    aliases:
      - smas
    cmds:
      - git switch $MAIN_BRANCH
    silent: true

  patch-branch:
    desc: Create a patch branch
    aliases:
      - pab
    cmds:
      - git switch -c "patch-{{.TODAY}}"
    silent: true

  view:
    desc: View remote repository"
    cmds:
      - cmd: wsl-open $CODEBERG_URL
    silent: true

  plugin-setup:
    desc: "Vendor Neovim plugin(s) into lua/plugins (usage: task plugin-setup -- <git-url>...)"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/nvim-plugin-clone.sh {{.CLI_ARGS}}"
    silent: true

  colorscheme-setup:
    desc: "Vendor colorscheme(s) into lua/colorschemes (usage: task colorscheme-setup -- <git-url>...)"
    env:
      NVIM_PLUGINS_DIR: "{{.TASKFILE_DIR}}/lua/colorschemes"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/nvim-plugin-clone.sh {{.CLI_ARGS}}"
    silent: true

  denops-plugin-setup:
    desc: "Vendor denops plugin(s) into lua/denops-plugins (usage: task denops-plugin-setup -- <git-url>...)"
    env:
      NVIM_PLUGINS_DIR: "{{.TASKFILE_DIR}}/lua/denops-plugins"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/nvim-plugin-clone.sh {{.CLI_ARGS}}"
    silent: true

  check-keys:
    desc: "Lint lua/**/keys.lua for LazyKeysSpec violations (nested opts tables)"
    aliases:
      - ck
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-keys-spec.sh"
    silent: true

  check-options-sync:
    desc: "Detect drift between Neovim's option set and lua/config/options.lua"
    aliases:
      - cos
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-options-sync.sh"
    silent: true

  check-tool-litter:
    desc: "Find formatters/linters that write into the working directory (e.g. ./.rumdl_cache)"
    aliases:
      - ctl
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-tool-litter.sh {{.CLI_ARGS}}"
    silent: true

  check-vendor-stalled:
    desc: "List remote add/* branches still stuck at the vendor-only stage"
    aliases:
      - cvs
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-vendor-stalled.sh {{.CLI_ARGS}}"
    silent: true
